<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>MapleUp</title>
  <link rel="stylesheet" href="./styles.css?v=0.5.0" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <h1>MapleUp</h1>
          <p>打王分身強化管理</p>
        </div>
      </div>

      <nav id="mainNav" class="nav">
        <button class="nav-btn active" data-view="dashboard">🔥 強化總覽</button>
        <button class="nav-btn" data-view="characters">👤 角色</button>
        <button class="nav-btn" data-view="crystals">💰 結晶</button>
        <button class="nav-btn" data-view="settings">⚙️ 設定</button>
      </nav>

      <div class="sync-card">
        <span class="status-dot"></span>
        <div>
          <strong>NEXON API</strong>
          <small>尚未連線</small>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">MapleStory Boss Mule Manager</p>
          <h2 id="pageTitle">強化總覽</h2>
        </div>
        <button id="addCharacterBtn" class="primary-btn">＋ 新增角色</button>
      </header>

      <p id="notice" role="status" aria-live="polite" hidden></p>
      <section id="view"></section>
    </main>
  </div>

  <dialog id="characterDialog">
    <form method="dialog" id="characterForm" class="dialog-card">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">Character</p>
          <h3 id="characterDialogTitle">新增角色</h3>
        </div>
        <button type="button" data-close-character class="icon-btn" aria-label="關閉">✕</button>
      </div>
      <div id="nexonQuickAdd" class="nexon-quick-add">
        <div><strong>用 NEXON API 快速建立</strong><p>只要填角色名稱，就會自動帶入職業、等級、戰力、能力值與裝備。</p></div>
        <button id="importCharacterBtn" type="button" class="primary-btn">從 NEXON 匯入</button>
      </div>
      <label>角色名稱<input name="name" required placeholder="例如：暗夜行者" /></label>
      <label>職業<select name="job" required></select></label>
      <label>等級<input name="level" type="number" min="1" value="260" required /></label>
      <label>指定 Boss<input name="targetBoss" placeholder="例如：困難史烏" /></label>
      <label>最佳通關時間（mm:ss）<input name="bestTime" placeholder="例如：28:42" pattern="[0-9]+:[0-5][0-9]" /></label>
      <label>備註<textarea name="notes" rows="3" placeholder="例如：等活動再強化"></textarea></label>
      <p class="muted">目前戰力只由 NEXON API 同步，不在這裡手動修改。更換 Boss 後請重新填寫通關時間。</p>
      <p id="formError" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" data-close-character class="ghost-btn">取消</button>
        <button id="saveCharacterBtn" type="submit" value="default" class="primary-btn">新增</button>
      </div>
    </form>
  </dialog>

  <dialog id="crystalDialog" aria-labelledby="crystalDialogTitle">
    <form method="dialog" id="crystalForm" class="dialog-card">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">Crystal income</p>
          <h3 id="crystalDialogTitle">新增結晶紀錄</h3>
        </div>
        <button type="button" data-close-crystal class="icon-btn" aria-label="關閉">✕</button>
      </div>
      <label>角色<select name="characterId" required></select></label>
      <label>類型<select name="cycle"><option value="weekly">週王</option><option value="monthly">月王</option></select></label>
      <label>Boss<input name="boss" required placeholder="例如：困難史烏" /></label>
      <label>週期起始日<input name="weekStart" type="date" required /></label>
      <label>結晶收入<input name="income" type="number" min="0" step="1" required /></label>
      <label class="check-label"><input name="done" type="checkbox" /> 已完成並計入收入</label>
      <label>備註<textarea name="notes" rows="3" placeholder="例如：兩人分配後金額"></textarea></label>
      <p class="muted">既有的角色合計資料會保留為「未分類」，之後可以逐筆整理成 Boss 紀錄。</p>
      <p id="crystalFormError" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" data-close-crystal class="ghost-btn">取消</button>
        <button id="saveCrystalBtn" type="submit" class="primary-btn">新增</button>
      </div>
    </form>
  </dialog>

  <dialog id="importDialog" aria-labelledby="importTitle">
    <div class="dialog-card">
      <h3 id="importTitle">確認還原備份</h3>
      <p id="importSummary"></p>
      <p>還原會取代目前所有角色、戰力與結晶紀錄。替換前會保留一份本機復原備份。</p>
      <p id="importError" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="cancelImport" class="ghost-btn">取消</button>
        <button id="confirmImport" class="primary-btn">確認還原</button>
      </div>
    </div>
  </dialog>
  <script src="./core.js?v=0.5.0"></script>
  <script src="./boss-catalog.js?v=0.5.0"></script>
  <script src="./nexon.js?v=0.5.0"></script>
  <script src="./app.js?v=0.5.0"></script>
</body>
</html>
